baseURL: "https://sikkimlfa.github.io/"
locale: "en-us"
title: "Sikkim LFA"
theme: "PaperMod"

enableEmoji: true
enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: posts
      name: All Posts
      url: /posts/
      weight: 20
    - identifier: search
      name: Search Posts
      url: /search/
      weight: 30
    - identifier: documents
      name: Acts & Documents
      url: /documents/
      weight: 40
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 50
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 60
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 70
    - identifier: repo-link
      name: "GitHub ↗"
      url: "https://github.com/sikkimlfa/sikkimlfa.github.io"
      weight: 80

taxonomies:
  category: categories
  tag: tags

params:
  env: "production"
  title: "Sikkim LFA"
  description: "Directorate of Local Fund Audit, Finance Department, Government of Sikkim."
  author: "Directorate of Local Fund Audit"

  defaultTheme: "auto"
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  profileMode:
    enabled: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys: ["title", "permalink", "summary", "content"]

  socialIcons:
    - name: "github"
      url: "https://github.com/sikkimlfa/sikkimlfa.github.io"
    - name: "email"
      url: "mailto:contact@sikkimlfa.gov.in"

markup:
  goldmark:
    renderer:
      unsafe: true