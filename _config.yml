# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Change to your timezone
timezone: Asia/Kolkata

title: sikkimlfa
tagline: Directorate of Local Fund Audit Sikkim

description: >-
  Primary Audit Institution in Sikkim for Local Bodies.

# Fill in the protocol & hostname for your site.
url: "https://sikkimlfa.github.io"

github:
  username: sikkimlfa

twitter:
  username: sikkimlfa

social:
  name: sikkim local fund audit
  email: sikkimlfa@gmail.com
  links:
    - https://twitter.com/sikkimlfa
    - https://github.com/sikkimlfa

# Web Analytics Settings
analytics:
  google:
    id:
  goatcounter:
    id:

theme_mode:

cdn:

avatar: https://lh3.googleusercontent.com/a/ACg8ocKJgSWOTss9RWF05PT_sGuX3w3Gy0_XJHtsL0fXuGsbB3lLfCiL=w80-h80-n-v1-rj

social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider:

assets:
  self_host:
    enabled:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

# The base URL of your site (Empty for user sites like username.github.io)
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

plugins:
  - jekyll-archives

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
