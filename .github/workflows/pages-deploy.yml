name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Sanitize and Clean Tags & Categories
        run: |
          python3 -c '
          import os, re
          posts_dir = "_posts"
          if os.path.exists(posts_dir):
              for root, _, files in os.walk(posts_dir):
                  for file in files:
                      if file.endswith((".md", ".markdown")):
                          path = os.path.join(root, file)
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()
                          def clean_taxonomies(match):
                              prefix = match.group(1)
                              raw_vals = match.group(2)
                              items = [x.strip().strip("\"'").strip() for x in raw_vals.split(",") if x.strip()]
                              cleaned = []
                              seen = set()
                              for item in items:
                                  lowered = item.lower()
                                  if lowered and lowered not in seen:
                                      seen.add(lowered)
                                      cleaned.append(f"\"{lowered}\"")
                              return f"{prefix}: [{", ".join(cleaned)}]"
                          new_content = re.sub(r"^(categories|tags):\s*\[(.*?)\]", clean_taxonomies, content, flags=re.MULTILINE)
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(new_content)
          '

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
