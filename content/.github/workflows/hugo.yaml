name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Sanitize and Validate Markdown Posts
        run: |
          python -c "
          import os, re, yaml
          from datetime import datetime

          post_dir = 'content/posts'

          def clean_taxonomy(val):
              if not val:
                  return []
              if isinstance(val, list):
                  return [str(x).strip() for x in val if str(x).strip()]
              if isinstance(val, str):
                  if ',' in val:
                      return [x.strip() for x in val.split(',') if x.strip()]
                  return [val.strip()]
              return [str(val).strip()]

          def fix_date_string(date_val):
              if isinstance(date_val, (datetime,)):
                  return date_val.strftime('%Y-%m-%dT%H:%M:%S+05:30')
              d_str = str(date_val).strip('\"\' ')
              m = re.match(r'^([0-9]{4}-[0-9]{1,2}-[0-9]{1,2})(?:[ T]([0-9]{1,2}:[0-9]{1,2}:[0-9]{1,2}))?(?:\s*([+-][0-9]{2}:?[0-9]{2}|Z))?$', d_str)
              if m:
                  date_part = m.group(1)
                  y, mo, d = date_part.split('-')
                  date_part = f'{int(y):04d}-{int(mo):02d}-{int(d):02d}'
                  time_part = m.group(2) if m.group(2) else '00:00:00'
                  th, tm, ts = time_part.split(':')
                  time_part = f'{int(th):02d}:{int(tm):02d}:{int(ts):02d}'
                  tz_part = m.group(3) if m.group(3) else '+05:30'
                  if tz_part != 'Z' and len(tz_part) == 5 and ':' not in tz_part:
                      tz_part = tz_part[:3] + ':' + tz_part[3:]
                  return f'{date_part}T{time_part}{tz_part}'
              return d_str

          if os.path.exists(post_dir):
              for fname in os.listdir(post_dir):
                  if not fname.endswith(('.md', '.markdown')):
                      continue
                  fpath = os.path.join(post_dir, fname)
                  with open(fpath, 'r', encoding='utf-8') as f:
                      content = f.read()

                  parts = re.split(r'^---\s*$', content, flags=re.MULTILINE)
                  if len(parts) < 3:
                      continue

                  fm_raw = parts[1]
                  body = '---'.join(parts[2:])

                  try:
                      data = yaml.safe_load(fm_raw) or {}
                  except Exception as e:
                      print(f'Warning: Could not parse YAML in {fname}: {e}')
                      continue

                  # Clean core front matter fields
                  if 'title' in data:
                      data['title'] = str(data['title']).strip()
                  if 'date' in data:
                      data['date'] = fix_date_string(data['date'])
                  if 'categories' in data:
                      data['categories'] = clean_taxonomy(data['categories'])
                  if 'tags' in data:
                      data['tags'] = clean_taxonomy(data['tags'])

                  # Chirpy compatibility transforms
                  if 'pin' in data:
                      if data.get('pin') is True:
                          data['weight'] = 1
                      del data['pin']

                  if 'image' in data and isinstance(data['image'], dict):
                      img_path = data['image'].get('path', '')
                      img_alt = data['image'].get('alt', '')
                      img_path = img_path.replace('/assets/img/', 'img/').replace('/img/', 'img/')
                      data['cover'] = {
                          'image': img_path,
                          'alt': img_alt,
                          'relative': False
                      }
                      del data['image']

                  # Body cleaning
                  body = re.sub(r'\{:\s*[^}]+\s*\}', '', body)
                  body = re.sub(r'\{%\s*[^%]+%\s*\}', '', body)
                  body = re.sub(r'\{\{\s*site\.(baseurl|url)\s*\}\}', '', body)
                  body = body.replace('/assets/img/', '/img/')

                  clean_yaml = yaml.dump(data, allow_unicode=True, default_flow_style=False, sort_keys=False)
                  new_content = f'---\n{clean_yaml}---\n{body.lstrip()}'

                  with open(fpath, 'w', encoding='utf-8') as f:
                      f.write(new_content)

              print('Workflow: Post sanitization complete.')
          "

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4